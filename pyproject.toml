[project]
name = "strixpipeline"
version = "2.0.0-dev"
description = ""
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Språkbanken", email = "sb-info@svenska.gu.se" }]

dependencies = [
  "PyYAML>=6.0.1",
  "elasticsearch==8.15.1",
  "elasticsearch-dsl==8.12.0",
  "orjson==3.11.3",
  "strixconfigurer",
]

[project.scripts]
strix-pipeline = "strixpipeline.cli:cli"

[dependency-groups]
dev = [
  "ruff>=0.5.7",
  "ty>=0.0.51",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.basedpyright]
pythonVersion = "3.9"

[tool.ruff]
target-version = "py39"

[tool.uv]
exclude-newer = "P7D"

[tool.uv.build-backend]
module-name = "strixpipeline"
module-root = ""

[tool.uv.sources]
strixconfigurer = { git = "https://github.com/spraakbanken/strix-config-reader", tag = "v2.0" }
